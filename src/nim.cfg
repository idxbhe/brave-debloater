# Build settings for Brave DeBloater.
#
# Note: Nim 2.4.0 on Windows has a stdlib regression where `--app:gui`
# breaks compilation of system/dyncalls.nim. We therefore build a console
# target and switch the PE subsystem to Windows at link time, which gives
# the same result: a GUI app with no console window.
--passL:"-Wl,--subsystem,windows"

# Embed the application icon (compiled with windres into bravedebloater.res).
--passL:"bravedebloater.res"
